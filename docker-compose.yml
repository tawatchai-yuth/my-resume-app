services:
  postgres:
    image: postgres:17-alpine
    container_name: app-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-my_resume_db}

    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-my_resume_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: app-backend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 3000

      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-my_resume_db}?schema=public

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}

    ports:
      - "${BACKEND_PORT:-3000}:3000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_generated:/app/src/generated

volumes:
  postgres_data:
  backend_node_modules:
  backend_generated:
