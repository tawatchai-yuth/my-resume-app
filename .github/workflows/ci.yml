name: CI

on:
    push:
        branches: ["main", "dev"]

    pull_request:
        branches: ["main"]

jobs:
    # ==========================================
    # Backend
    # ==========================================
    backend:
        name: Backend (lint, typecheck, test, build)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npm run typecheck

            - name: Test
              run: npm run test

            - name: Build
              run: npm run build

    # ==========================================
    # Frontend
    # ==========================================
    frontend:
        name: Frontend (lint, typecheck, build)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Type check
              run: npx tsc --noEmit

            - name: Build
              run: npm run build

    # ==========================================
    # Docker
    # ==========================================
    docker:
        name: Docker Images Build
        runs-on: ubuntu-latest

        needs:
            - backend
            - frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build Docker images
              run: docker compose build

            - name: Start containers
              run: docker compose up -d

            - name: Wait for API to become healthy
              run: |
                  echo "Waiting for API..."

                  for i in {1..30}; do
                    if curl --fail http://localhost:3000/health; then
                      echo "API is healthy"
                      exit 0
                    fi

                    echo "API is not ready yet..."
                    sleep 2
                  done

                  echo "API failed to become healthy"
                  docker compose logs
                  exit 1

            - name: Stop containers
              if: always()
              run: docker compose down
