name: CI

on:
  push:
    branches: ["main", "dev"]

  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cach: npm
          cach-dependency-path: backend/package-lock.json

      - name: Install dependency
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cach: npm
          cach-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: ["backend", "frontend"]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          # Only needed because docker-compose.yml requires JWT_SECRET to be
          # set at all -- this step never runs the containers, just builds
          # the images, so a placeholder is fine here.
          JWT_SECRET: ci-build-placeholder
