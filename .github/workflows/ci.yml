name: CI

on:
    push:
        branches: ["main", "dev"]

    pull_request:
        branches: ["main"]

jobs:
    frontend:
        name: Frontend (install, build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - working-directory: frontend
              run: |
                  npm ci
                  npm run build
