name: CD

on:
    workflow_run:
        workflows:
            - CI

        types:
            - completed

        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    # ==========================================
    # Deploy
    # ==========================================

    deploy:
        name: Build and Deploy to Linux VPS

        # ==========================================
        # GitHub Environment
        # ==========================================

        environment: production

        # ==========================================
        # Only deploy when CI succeeds
        # ==========================================

        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest

        steps:
            # ==========================================
            # Checkout exact commit from CI
            # ==========================================

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            # ==========================================
            # Check deployment secrets
            # ==========================================

            - name: Check deployment secrets
              shell: bash
              env:
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USERNAME: ${{ secrets.VPS_USERNAME }}
                  VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
                  VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

              run: |
                  set -e

                  echo "Checking deployment secrets..."

                  if [ -z "$VPS_HOST" ]; then
                      echo "ERROR: VPS_HOST is missing"
                      exit 1
                  fi

                  if [ -z "$VPS_USERNAME" ]; then
                      echo "ERROR: VPS_USERNAME is missing"
                      exit 1
                  fi

                  if [ -z "$VPS_APP_PATH" ]; then
                      echo "ERROR: VPS_APP_PATH is missing"
                      exit 1
                  fi

                  if [ -z "$VPS_SSH_PRIVATE_KEY" ]; then
                      echo "ERROR: VPS_SSH_PRIVATE_KEY is missing"
                      exit 1
                  fi

                  echo "VPS_HOST is configured"
                  echo "VPS_USERNAME is configured"
                  echo "VPS_APP_PATH is configured"
                  echo "VPS_SSH_PRIVATE_KEY is configured"

            # ==========================================
            # Login to GHCR
            # ==========================================

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ==========================================
            # Setup Docker Buildx
            # ==========================================

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            # ==========================================
            # Build + Push Backend
            # ==========================================

            - name: Build and push backend
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.prod

                  push: true

                  tags: |
                      ghcr.io/${{ github.repository_owner }}/my-resume-backend:sha-${{ github.event.workflow_run.head_sha }}

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ==========================================
            # Build + Push Frontend
            # ==========================================

            - name: Build and push frontend
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile

                  push: true

                  build-args: |
                      BUILD_CONFIGURATION=production

                  tags: |
                      ghcr.io/${{ github.repository_owner }}/my-resume-frontend:sha-${{ github.event.workflow_run.head_sha }}

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ==========================================
            # Deploy to Linux VPS
            # ==========================================

            - name: Deploy to Linux VPS
              uses: appleboy/ssh-action@v1.2.2

              env:
                  IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}

              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USERNAME }}
                  key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

                  envs: IMAGE_TAG

                  script: |
                      set -e

                      echo "=========================================="
                      echo "Deploying to Linux VPS"
                      echo "=========================================="

                      echo "IMAGE_TAG=${IMAGE_TAG}"

                      # ==========================================
                      # Go to application directory
                      # ==========================================

                      cd "${{ secrets.VPS_APP_PATH }}"

                      echo "Application path:"
                      pwd

                      # ==========================================
                      # Create deployment environment
                      # ==========================================

                      echo "Creating .env.deploy"

                      cat > .env.deploy <<EOF
                      IMAGE_TAG=${IMAGE_TAG}
                      EOF

                      # ==========================================
                      # Pull Docker images
                      # ==========================================

                      echo "Pulling Docker images..."

                      docker compose \
                        --env-file .env.prod \
                        --env-file .env.deploy \
                        -f docker-compose.prod.yml \
                        pull

                      # ==========================================
                      # Start / Update containers
                      # ==========================================

                      echo "Starting containers..."

                      docker compose \
                        --env-file .env.prod \
                        --env-file .env.deploy \
                        -f docker-compose.prod.yml \
                        up -d

                      # ==========================================
                      # Show container status
                      # ==========================================

                      echo "Container status:"

                      docker compose \
                        --env-file .env.prod \
                        --env-file .env.deploy \
                        -f docker-compose.prod.yml \
                        ps

                      # ==========================================
                      # Cleanup unused Docker images
                      # ==========================================

                      echo "Cleaning unused Docker images..."

                      docker image prune -f

                      echo "=========================================="
                      echo "Deployment completed"
                      echo "=========================================="
