name: CD

on:
    workflow_run:
        workflows:
            - CI

        types:
            - completed

        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    # ==========================================
    # Build and Push
    # ==========================================

    build-and-push:
        name: Build and Push Docker Images

        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        runs-on: ubuntu-latest

        steps:
            # ==========================================
            # Checkout exact commit from CI
            # ==========================================

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            # ==========================================
            # Login to GHCR
            # ==========================================

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ==========================================
            # Setup Docker Buildx
            # ==========================================

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            # ==========================================
            # Build + Push Backend
            # ==========================================

            - name: Build and push backend
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.prod

                  push: true

                  tags: |
                      ghcr.io/${{ github.repository_owner }}/my-resume-backend:sha-${{ github.event.workflow_run.head_sha }}

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ==========================================
            # Build + Push Frontend
            # ==========================================

            - name: Build and push frontend
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile

                  push: true

                  build-args: |
                      BUILD_CONFIGURATION=production

                  tags: |
                      ghcr.io/${{ github.repository_owner }}/my-resume-frontend:sha-${{ github.event.workflow_run.head_sha }}

                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ==========================================
            # Deployment Status
            # ==========================================

            - name: Build and Push completed
              run: |
                  echo "=========================================="
                  echo "Build and Push completed"
                  echo "=========================================="

                  echo "Backend:"
                  echo "ghcr.io/${{ github.repository_owner }}/my-resume-backend:sha-${{ github.event.workflow_run.head_sha }}"

                  echo "Frontend:"
                  echo "ghcr.io/${{ github.repository_owner }}/my-resume-frontend:sha-${{ github.event.workflow_run.head_sha }}"
